name: Bootstrap Portfolio Source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap-ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand portfolio source
        shell: bash
        run: |
          set -euo pipefail
          cat portfolio-source.part*.b64 > portfolio-source.tar.gz.b64
          base64 -d portfolio-source.tar.gz.b64 > portfolio-source.tar.gz
          tar -xzf portfolio-source.tar.gz -C . --exclude='.github/workflows/deploy.yml'
          rm -f portfolio-source.tar.gz portfolio-source.tar.gz.b64 portfolio-source.part*.b64 bootstrap-ready.txt

      - name: Commit portfolio source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish portfolio source"
          git push origin HEAD:main
