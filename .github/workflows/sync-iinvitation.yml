name: Sync Iinvitation Live Site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-iinvitation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Iinvitation source
        uses: actions/checkout@v4
        with:
          repository: Febriantrip/iinvitation
          ref: main
          path: _iinvitation-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _iinvitation-source/package-lock.json

      - name: Install Iinvitation dependencies
        working-directory: _iinvitation-source
        run: npm ci

      - name: Build Iinvitation for project Pages path
        working-directory: _iinvitation-source
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Publish Iinvitation under /iinvitation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf iinvitation
          mkdir -p iinvitation
          cp -a _iinvitation-source/dist/. iinvitation/
          rm -rf _iinvitation-source

      - name: Commit live site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iinvitation
          if git diff --cached --quiet; then
            echo "Iinvitation live site already up to date."
            exit 0
          fi
          git commit -m "site: publish Iinvitation live demo"
          git push origin HEAD:main
